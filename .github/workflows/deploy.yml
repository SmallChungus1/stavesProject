# Required GitHub Secrets:
#   MLFLOW_TRACKING_URI         — Dagshub MLflow tracking URL
#   MLFLOW_TRACKING_USERNAME    — Dagshub username
#   MLFLOW_TRACKING_PASSWORD    — Dagshub access token
#   OCI_REGISTRY_USERNAME       — <tenancy-namespace>/<oci-username>
#   OCI_AUTH_TOKEN              — OCI auth token for container registry
#   OCI_REGISTRY_NAMESPACE      — OCI tenancy namespace (ex: ax*)
#   OCI_VM_HOST                 — Public IP of the OCI VM
#   OCI_VM_USER                 — SSH user (ex: opc)
#   OCI_SSH_KEY                 — Private SSH key contents

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/fixtures/**'

env:
  OCI_REGION:         phx
  REGISTRY_NAMESPACE: ${{ secrets.OCI_REGISTRY_NAMESPACE }}
  IMAGE_NAME:         staves-detector

jobs:
  #job1: pulls model from Mlflow, builds docker image, pushes to OCI registry
  build-and-push:
    runs-on: ubuntu-latest
    if: success()
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install download dependencies
        run: pip install mlflow python-dotenv

      - name: Download counter model
        run: python download_registered_model.py --mode finetune
        env:
          MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      - name: Download localizer model
        run: python download_registered_model.py --mode localizer
        env:
          MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCI Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGION }}.ocir.io
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.OCI_REGION }}.ocir.io/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.OCI_REGION }}.ocir.io/${{ env.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  #Job 2: SSH into VM, pull new image, restart container
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key:      ${{ secrets.OCI_SSH_KEY }}
          envs:     OCI_REGISTRY_USERNAME,OCI_AUTH_TOKEN,REGISTRY,REGISTRY_NAMESPACE,IMAGE_NAME
          script: |
            docker login "$REGISTRY" \
              -u "$OCI_REGISTRY_USERNAME" \
              -p "$OCI_AUTH_TOKEN"
            docker pull "$REGISTRY/$REGISTRY_NAMESPACE/$IMAGE_NAME:latest"
            docker stop "$IMAGE_NAME" || true
            docker rm   "$IMAGE_NAME" || true
            docker run -d \
              --name "$IMAGE_NAME" \
              --restart unless-stopped \
              -p 8000:8000 \
              "$REGISTRY/$REGISTRY_NAMESPACE/$IMAGE_NAME:latest"
            docker image prune -f
        env:
          OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_AUTH_TOKEN:        ${{ secrets.OCI_AUTH_TOKEN }}
          REGISTRY:              ${{ env.OCI_REGION }}.ocir.io
          REGISTRY_NAMESPACE:    ${{ env.REGISTRY_NAMESPACE }}
          IMAGE_NAME:            ${{ env.IMAGE_NAME }}
