<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inference Logs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <div>
          <h1 class="header-title">Inference Logs</h1>
          <p class="header-sub">SQLite-backed inference history</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="btn-secondary header-link" href="/">Back to app</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="card">
      <div class="section-header logs-toolbar">
        <p class="card-title" style="margin:0">Inference Metrics</p>
        <div class="logs-filters">
          <label class="filter-label" for="metricSelect">Metric</label>
          <select class="filter-select" id="metricSelect">
            <option value="latency_ms" selected>Latency (ms)</option>
            <option value="predicted_count">Predicted Count</option>
            <option value="mean_confidence">Mean Confidence</option>
            <option value="median_confidence">Median Confidence</option>
            <option value="min_confidence">Min Confidence</option>
            <option value="max_confidence">Max Confidence</option>
            <option value="low_confidence_detections">Low Confidence Count</option>
            <option value="error_rate_pct">Error Rate (%)</option>
          </select>

          <label class="filter-label" for="timeRange">Time</label>
          <select class="filter-select" id="timeRange">
            <option value="7d" selected>Last 7 days</option>
            <option value="30d">Last 30 days</option>
            <option value="90d">Last 3 months</option>
            <option value="365d">Last year</option>
            <option value="all">All time</option>
          </select>

          <label class="filter-label" for="errorFilter">Status</label>
          <select class="filter-select" id="errorFilter">
            <option value="all" selected>All</option>
            <option value="errors_only">Errors only</option>
            <option value="success_only">Success only</option>
          </select>
        </div>
      </div>

      <div class="plot-panel">
        <div class="plot-meta">
          <p class="plot-title" id="plotTitle">Latency (ms)</p>
          <p class="plot-subtitle" id="plotSubtitle">Daily Median</p>
        </div>
        <div id="logsPlotDiv" class="plotly-chart"></div>
      </div>

      <div class="section-header logs-table-header">
        <p class="card-title" style="margin:0">Inference Log Table</p>
      </div>
      <div class="table-wrap" id="logsTableDiv">
        <p class="table-empty">No inference logs yet.</p>
      </div>
    </section>
  </main>

  <script>
    let refreshInFlight = false;
    const displayTimeZone = 'America/Chicago';
    const metricLabels = {
      latency_ms: 'Latency (ms)',
      predicted_count: 'Predicted Count',
      mean_confidence: 'Mean Confidence',
      median_confidence: 'Median Confidence',
      min_confidence: 'Min Confidence',
      max_confidence: 'Max Confidence',
      low_confidence_detections: 'Low Confidence Count',
      error_rate_pct: 'Error Rate (%)'
    };

    function parseUtcSqlTimestamp(timestamp) {
      return new Date(timestamp.replace(' ', 'T') + 'Z');
    }

    function formatChicagoTimestamp(timestamp) {
      return new Intl.DateTimeFormat('en-US', {
        timeZone: displayTimeZone,
        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true,
        timeZoneName: 'short'
      }).format(parseUtcSqlTimestamp(timestamp));
    }

    function convertTableTimestampsToChicago() {
      const rows = document.querySelectorAll('#logsTableDiv table tbody tr');
      rows.forEach((row) => {
        const firstCell = row.querySelector('td');
        if (!firstCell) return;
        const utcTimestamp = firstCell.textContent.trim();
        if (!utcTimestamp) return;
        firstCell.textContent = formatChicagoTimestamp(utcTimestamp);
      });
    }

    function buildLogsDataQuery() {
      const params = new URLSearchParams({
        metric: document.getElementById('metricSelect').value,
        time_range: document.getElementById('timeRange').value,
        error_filter: document.getElementById('errorFilter').value
      });
      return `/logs_data/?${params.toString()}`;
    }

    function renderEmptyPlot(message) {
      document.getElementById('plotTitle').textContent = metricLabels[document.getElementById('metricSelect').value];
      document.getElementById('plotSubtitle').textContent = message;
      Plotly.react('logsPlotDiv', [], {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        margin: { l: 48, r: 20, t: 12, b: 40 },
        xaxis: { visible: false },
        yaxis: { visible: false },
        annotations: [{
          text: 'No data for the selected filters',
          showarrow: false,
          font: { color: '#8b949e', family: 'Inter, sans-serif', size: 13 }
        }]
      }, { responsive: true, displayModeBar: false });
    }

    function renderPlot(payload) {
      const metric = payload.metric;
      const label = metricLabels[metric] || metric;
      const isErrorRate = metric === 'error_rate_pct';
      const rawPoints = payload.raw_points || [];
      const aggregatePoints = payload.aggregate_points || [];

      document.getElementById('plotTitle').textContent = label;
      document.getElementById('plotSubtitle').textContent = payload.aggregate_label || 'Daily aggregation';

      if (!rawPoints.length && !aggregatePoints.length) {
        renderEmptyPlot(document.getElementById('plotSubtitle').textContent);
        return;
      }

      const traces = [];

      if (rawPoints.length) {
        traces.push({
          x: rawPoints.map((point) => parseUtcSqlTimestamp(point.timestamp)),
          y: rawPoints.map((point) => point.value),
          customdata: rawPoints.map((point) => formatChicagoTimestamp(point.timestamp)),
          type: 'scatter',
          mode: 'markers',
          name: 'Raw Points',
          showlegend: false,
          marker: {
            color: isErrorRate ? 'rgba(248, 81, 73, 0.35)' : 'rgba(88, 166, 255, 0.35)',
            size: 6
          },
          hovertemplate: isErrorRate
            ? '%{customdata}<br>Error Rate: %{y:.2f}%<extra></extra>'
            : `%{customdata}<br>${label}: %{y:.4f}<extra></extra>`
        });
      }

      if (aggregatePoints.length) {
        traces.push({
          x: aggregatePoints.map((point) => parseUtcSqlTimestamp(point.timestamp)),
          y: aggregatePoints.map((point) => point.value),
          customdata: aggregatePoints.map((point) => formatChicagoTimestamp(point.timestamp)),
          type: 'scatter',
          mode: 'lines',
          name: payload.aggregate_label || 'Aggregate',
          showlegend: false,
          line: {
            color: isErrorRate ? 'rgba(248, 81, 73, 0.95)' : 'rgba(88, 166, 255, 0.95)',
            width: 3
          },
          hovertemplate: isErrorRate
            ? '%{customdata}<br>Daily Error Rate: %{y:.2f}%<extra></extra>'
            : `%{customdata}<br>${payload.aggregate_label || 'Daily Aggregate'}: %{y:.4f}<extra></extra>`
        });
      }

      const layout = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        margin: { l: 56, r: 20, t: 12, b: 40 },
        hovermode: 'x unified',
        xaxis: {
          color: '#8b949e',
          gridcolor: 'rgba(139, 148, 158, 0.12)',
          zerolinecolor: 'rgba(139, 148, 158, 0.12)'
        },
        yaxis: {
          title: label,
          color: '#8b949e',
          gridcolor: 'rgba(139, 148, 158, 0.12)',
          zerolinecolor: 'rgba(139, 148, 158, 0.12)',
          ticksuffix: isErrorRate ? '%' : ''
        },
        font: {
          color: '#e6edf3',
          family: 'Inter, sans-serif'
        }
      };

      Plotly.react('logsPlotDiv', traces, layout, {
        responsive: true,
        displayModeBar: false
      });
    }

    async function refreshLogsView() {
      if (refreshInFlight) return;
      refreshInFlight = true;

      try {
        const payload = await fetch(buildLogsDataQuery(), { cache: 'no-store' }).then((r) => r.json());
        document.getElementById('logsTableDiv').innerHTML = payload.table_html;
        convertTableTimestampsToChicago();
        renderPlot(payload);
      } finally {
        refreshInFlight = false;
      }
    }

    document.getElementById('metricSelect').addEventListener('change', refreshLogsView);
    document.getElementById('timeRange').addEventListener('change', refreshLogsView);
    document.getElementById('errorFilter').addEventListener('change', refreshLogsView);

    window.addEventListener('DOMContentLoaded', refreshLogsView);
    window.addEventListener('focus', refreshLogsView);
    window.addEventListener('pageshow', refreshLogsView);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshLogsView();
    });
  </script>
</body>
</html>
